<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Migration dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <h1>Migration dashboard</h1>
    <p id="project" class="muted">Loading <code>/migration/</code>…</p>
  </header>
  <main>
    <section id="steps"><h2>Steps</h2><div class="panel"></div></section>
    <section id="inventory"><h2>URL inventory</h2><div class="panel"></div></section>
    <section id="redirects"><h2>Redirects</h2><div class="panel"></div></section>
    <section id="not-to-migrate"><h2>Not to migrate</h2><div class="panel"></div></section>
    <section id="urls">
      <h2>URLs</h2>
      <form class="filters" onsubmit="return false">
        <input type="search" name="q" placeholder="Search URL…" autocomplete="off">
        <select name="kind"><option value="">any kind</option></select>
        <select name="group"><option value="">any group</option></select>
        <select name="cached">
          <option value="">cached or not</option>
          <option value="yes">cached</option>
          <option value="no">not cached</option>
        </select>
        <span class="muted" data-count></span>
      </form>
      <div class="panel"></div>
    </section>
    <section id="report"><h2>Report</h2><div class="panel"></div></section>
  </main>
  <footer class="muted">
    Read-only view of <code>migration/</code>. Served locally by <code>aem up</code>;
    <code>migration/</code> is excluded from deployment by <code>.hlxignore</code>.
  </footer>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
