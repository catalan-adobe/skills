stage: bulk
params: [template]
timeouts: { unit_minutes: 120 }
units:
  - id: dry-run
    run: node scripts/lib/bulk.mjs --template <template> --dry-run
    depends_on: []
    outputs:
      - data/bulk/<template>-dryrun.json
      - reports/bulk-<template>-dryrun.md
      - reports/bulk-<template>-transformer.md
    done_when: node scripts/lib/stage.mjs check-dry-run <template>
  - id: run
    run: node scripts/lib/bulk.mjs --template <template> --run
    depends_on: [dry-run]
    resume: { while: deadline, max_rounds: 8 }
    outputs: [data/bulk/<template>-run.json]
    done_when: node scripts/lib/stage.mjs check-run <template>
  - id: sample-fidelity
    run: node scripts/lib/stage.mjs sample-fidelity <template> --pages 5
    depends_on: [run]
    outputs: [reports/bulk-<template>-fidelity.json]
    done_when: node scripts/lib/stage.mjs check-fidelity <template>
  - id: retro
    role: prompts/retro-writer.md
    tier: low
    parallel: false
    depends_on: [sample-fidelity]
    inputs:
      - data/ledger/units.jsonl
      - data/ledger/runs.jsonl
      - reports/bulk-<template>-longtail.md
    outputs: [LEARNINGS.md]
    done_when: test -s migration/LEARNINGS.md
